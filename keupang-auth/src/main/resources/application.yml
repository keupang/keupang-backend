spring:
    autoconfigure:
        exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
    application:
        name: auth
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

server:
    port: ${PORT:8080}


springdoc:
    api-docs:
        path: /auth/v3/api-docs
    swagger-ui:
        path: /auth/swagger-ui.html

openapi:
    service:
        # API Gateway 포트
        url: "${GATEWAY_PUBLIC_URL:http://localhost:8080}"

jwt:
    private-key: ${jwt_private_key:}
    public-key: ${jwt_public_key:}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            probes:
                enabled: true
    metrics:
        distribution:
            percentiles-histogram:
                http.server.requests: true
                http.client.requests: true
        tags:
            application: ${spring.application.name}

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://${security_username}:${security_password}@eureka-server:8761/eureka
    instance:
        instance-id: auth-service-${spring.application.instance-id:${random.value}}
        prefer-ip-address: true
