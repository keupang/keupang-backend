spring:
    application:
        name: order
    profiles:
        active: dev
    config:
        import: configserver:http://${security_username}:${security_password}@config-server:9000
    datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${ORDER_DB_NAME}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
        open-in-view: false

springdoc:
    api-docs:
        path: /order/v3/api-docs
    swagger-ui:
        path: /order/swagger-ui.html

openapi:
    service:
        url: "${GATEWAY_PUBLIC_URL:http://localhost:8080}"

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://${security_username}:${security_password}@eureka-server:8761/eureka
    instance:
        instance-id: order-service-${spring.application.instance-id:${random.value}}
        prefer-ip-address: true
